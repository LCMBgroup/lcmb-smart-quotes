name: Fix LCMB Quote Website Files

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-lcmb-files.yml"

permissions:
  contents: write

jobs:
  fix-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy LCMB quote files to root
        run: |
          set -e

          SOURCE="lcmb_custom_github_quote_builder_with_logos (2)"

          if [ ! -d "$SOURCE" ]; then
            echo "Source folder not found. It may already be fixed."
            exit 0
          fi

          echo "Copying LCMB website files from: $SOURCE"

          cp -R "$SOURCE/assets" .
          cp -R "$SOURCE/quotes" .
          cp "$SOURCE/index.html" .
          cp "$SOURCE/quote-generator.html" .

          if [ -f "$SOURCE/prompt.md" ]; then cp "$SOURCE/prompt.md" .; fi
          if [ -f "$SOURCE/robots.txt" ]; then cp "$SOURCE/robots.txt" .; fi
          if [ -f "$SOURCE/CNAME.example" ]; then cp "$SOURCE/CNAME.example" .; fi
          if [ -f "$SOURCE/GITHUB_SETUP_STEPS.md" ]; then cp "$SOURCE/GITHUB_SETUP_STEPS.md" .; fi
          if [ -f "$SOURCE/SERVICE_M8_TO_QUOTE_WORKFLOW.md" ]; then cp "$SOURCE/SERVICE_M8_TO_QUOTE_WORKFLOW.md" .; fi
          if [ -f "$SOURCE/EMAIL_SMS_TEMPLATES.md" ]; then cp "$SOURCE/EMAIL_SMS_TEMPLATES.md" .; fi
          if [ -f "$SOURCE/QUOTE_CHECKLIST.md" ]; then cp "$SOURCE/QUOTE_CHECKLIST.md" .; fi
          if [ -f "$SOURCE/PRIVACY_NOTES.md" ]; then cp "$SOURCE/PRIVACY_NOTES.md" .; fi

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Move LCMB quote website files to root"
            git push
          fi
